# ══════════════════════════════════════════════════════════════════════════════
# CI 构建发布：任意分支 push 即出包（只出 release），每次构建发成一个独立 tag 的预发布页。
#   母版：知识库 100_System/templates/build-ci.workflow.yml（规程：GitHub域/CI滚动发布页流程.md）
#   本项目（Flutter）对母版有四处改写：
#     ① 构建环境换成 Flutter 3.47.6 + JDK 17（母版是 Gradle + JDK 21 + Android SDK 直装）
#     ② 版本号：versionName 来自 pubspec.yaml，versionCode 由 CI 运行序号生成；
#        Flutter 的 --build-name 只收数字点分版本，塞不进 `+ci-<变体>.<短号>`，
#        改由 ci-fork-identity.py 就地让 Gradle 从环境变量取这两个值（只改工作区）
#     ③ 产物定位：Flutter 的 apk 在 build/app/outputs/flutter-apk/，文件名按 ABI 与变体拼
#     ④ fork 身份：只错开包名 / 显示名（Flutter 无内核态命名空间可撞），改写脚本
#        scripts/ci-fork-identity.py 只动 runner 工作区，仓库源码与上游逐字一致
# ══════════════════════════════════════════════════════════════════════════════
name: Build · CI

run-name: "Build · CI · ${{ github.ref_name }}"

on:
  push:
    # ⚠️ 必须显式写 branches：只写 paths-ignore 时标签推送也会触发
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的提交/tag（留空则构建当前触发 ref）'
        type: string
        required: false
        default: ''

permissions:
  contents: write   # 发布 Release 需要写权限

env:
  # ════════════════════════ PROJECT-CUSTOM-BEGIN ════════════════════════
  # 前缀 / 显示名 / 门禁同源：改 label 一处即全变。它进 APK 文件名与下载 URL，
  # 只允许 A-Za-z0-9._-（ci-fork-identity.py 对 --label 有断言）
  FORK_LABEL: Kelivo.F
  # fork 包名：与上游 com.psyche.kelivo 并存安装，互不影响数据目录
  EXPECT_PACKAGE: com.psyche.kelivo.fork
  # namespace 没被动过（改它会让 Manifest 里的 .MainActivity 解析到不存在的类）
  EXPECT_ACTIVITY: com.psyche.kelivo.MainActivity
  EXPECT_ABI: arm64-v8a
  # tokens/Signing/Vstory.jks（别名 Vstory）的 SHA-256，去冒号大写
  EXPECTED_CERT_SHA256: '8D1B6022D3E3BB837A3BA1870E0EEAC8650F9470B8287EDF549DACEC9E9E2A64'
  # versionCode = 基数 + 运行序号。5000 远高于上游当前的 80（pubspec），且不随提交数倒退
  CI_VERSION_CODE_BASE: '5000'
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'
  # push 触发时出 debug + release：debug 排障日志最全，release 验证正式构建形态
  PUSH_VARIANT: release
  # ═════════════════════════ PROJECT-CUSTOM-END ═════════════════════════

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      # 指定 ref 构建时（如复现上游发版时代的代码），那棵树里没有 fork 的改写脚本，
      # 从 main 取一份备用，仍然只作用于 runner 工作区。
      - name: Restore fork scripts
        if: inputs.ref != ''
        run: |
          set -euo pipefail
          git fetch -q origin main
          mkdir -p scripts
          git show origin/main:scripts/ci-fork-identity.py > scripts/ci-fork-identity.py

      # 上游 v1.3.1 发版时（10-09）pub 解析到 shared_preferences_android 2.4.28；2.5.0 是
      # 10-17 才发的，晚构建就会拿到 2.5.x —— 它的 Pigeon JNI 签名里的类名会被 R8 改名，
      # 启动即 NoSuchMethodError。只改工作区，仓库源码保持与上游一致。
      - name: Pin deps to upstream release build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          out = re.sub(r'(?m)^dependency_overrides:\n',
                       'dependency_overrides:\n  shared_preferences_android: 2.4.28\n', s, count=1)
          assert out != s, 'pubspec.yaml 里找不到 dependency_overrides 块'
          p.write_text(out)
          PY
          grep -A2 '^dependency_overrides:' pubspec.yaml

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 不用 subosito/flutter-action：它是复合 action，内部引用 actions/cache@v5（未钉 SHA），
      # 本仓库「只认完整 SHA」的策略会连嵌套引用一起拦。直接下官方 SDK 包，行为可控。
      # SDK 与 engine artifacts 有数百 MB 且版本由 FLUTTER_VERSION 钉死，命中最省时。
      # 不给 restore-keys：版本一变必须整包解压，旧目录残留会跟新版本混在一起。
      - name: Restore Flutter SDK
        id: flutter-sdk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter
        if: steps.flutter-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          rm -rf "$HOME/flutter"
          tar xf /tmp/flutter.tar.xz -C "$HOME"

      # 命中与否都要走一遍：GITHUB_PATH 只对后续步骤生效，缓存命中时也得补上。
      - name: Expose Flutter
        run: |
          set -euo pipefail
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"
          "$HOME/flutter/bin/flutter" --version

      # 不能用 setup-java 的 cache: 'gradle' —— 它内部调 actions/cache@v5，会撞同一个
      # 「只认完整 SHA」的策略拦截。缓存 Gradle 依赖与 pub 包：这两处才是构建耗时的大头。
      # 两者分开存：pubspec.lock 一变动不该把 Gradle 那份一起判失效。
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ env.FLUTTER_VERSION }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.FLUTTER_VERSION }}-gradle-

      - name: Cache pub
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.FLUTTER_VERSION }}-pub-

      # 只改工作区，不入库：包名落进仓库会让每次 rebase 上游都撞冲突。
      # ⚠️ 改的是 applicationId（最终包名），不动 namespace —— R 类与 .MainActivity 都跟 namespace 走。
      - name: Apply fork identity (workspace only, not committed)
        run: python3 scripts/ci-fork-identity.py --app-id "$EXPECT_PACKAGE" --label "$FORK_LABEL"

      # 短号取被构建的那份代码（checkout 后的 HEAD），不是触发提交：指定 ref 构建时两者
      # 不同，用触发提交的短号就看不出这一版到底是哪份源码。
      - name: Compute build info
        id: info
        run: |
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:8}" >> "$GITHUB_OUTPUT"
          echo "ts=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # 产物名只在这里算一次：重命名 / 正文表格 / 清理正则三处都引用它，漏改一处就是静默错。
      # 命名：<前缀>_<版本>.<code>_<时间>_ci-<序号>-<变体>_<短号>.apk
      - name: Resolve APK name
        id: target
        env:
          TS: ${{ steps.info.outputs.ts }}
          SHORT: ${{ steps.info.outputs.short }}
        run: |
          set -euo pipefail
          VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)"
          CODE="$(( CI_VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))"
          if [ "$CODE" -gt 2100000000 ]; then
            echo "::error::versionCode=$CODE 超过 2100000000 —— 查 CI_VERSION_CODE_BASE 是不是被改大了"
            exit 1
          fi
          if [ -z "$VER" ]; then
            echo "::error::读不到 pubspec.yaml 的 version"
            exit 1
          fi

          VLIST="$PUSH_VARIANT"
          case "$VLIST" in
            release|debug) ;;
            *) echo "::error::PUSH_VARIANT 非法：$VLIST"; exit 1 ;;
          esac

          {
            # 发布页按 tag 名比较（同一天的 commit 时间分不出先后），顺序即字符串降序：
            # 年月日.时分 单调递增即可，故 TS 拆成 26yymmdd.hhmm 两段。
            echo "tag=v${VER}-r${TS:2:6}.${TS##*-}.${SHORT}"
            echo "name=v${VER}-r${TS:2:6}.${TS##*-}.${SHORT}"
            echo "prerelease=true"
            echo "make_latest=false"
            echo "variants=${VLIST}"
            echo "variant_tag=$(printf '%s' "$VLIST" | tr ' ' '-')"
          } >> "$GITHUB_OUTPUT"
          for kv in "VER=$VER" "CODE=$CODE" "VARIANT_LIST=$VLIST" "SHORT=$SHORT"; do
            echo "${kv}" >> "$GITHUB_ENV"
          done

          for v in $VLIST; do
            # assets 列表按文件名升序展示，序号让 release 排在 debug 前面
            case "$v" in release) ORD=1 ;; debug) ORD=2 ;; *) ORD=9 ;; esac
            N="${FORK_LABEL}_${VER}.${CODE}_${TS}_ci-${ORD}-${v}_${SHORT}.apk"
            echo "APKNAME_$(printf '%s' "$v" | tr '[:lower:]' '[:upper:]')=${N}" >> "$GITHUB_ENV"
            echo "产物名（${v}）：${N}"
          done

      # 上游把 SiliconFlow 兜底 key 放在被 gitignore 的 lib/secrets/fallback.dart 里，
      # 不生成这个文件就编译不过；secret 缺失时写空串。
      - name: Inject fallback
        env:
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<EOF
          const String siliconflowFallbackKey = '${SILICONFLOW_KEY}';
          EOF

      # 签名：固定钥 tokens/Signing/Vstory.jks（各项目共用）。缺 secret 直接失败，
      # 不回退 debug 签名 —— 「构建成功、签名不对」要等覆盖安装时才暴露。
      - name: Prepare signing (fixed key from secrets)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for v in KEY_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret:$missing —— 拒绝回退（那会让产物无法覆盖升级）"
            exit 1
          fi

          printf '%s' "$KEY_BASE64" | base64 -d > android/app/key.jks
          keytool -list -keystore android/app/key.jks -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::密钥库打不开或别名不存在 —— 核对 KEY_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS"; exit 1; }
          echo "已校验：密钥库可打开、别名存在"

          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Flutter pub get
        run: flutter pub get

      # 每个变体单独构建：versionName 是 defaultConfig 级的，无法在 Gradle 里按变体区分，
      # 只能每轮换一个环境变量再编。版本号取值见 ci-fork-identity.py 的改写项。
      - name: Flutter build
        run: |
          set -euo pipefail
          # 不用 --split-per-abi：它会给每个 ABI 的包叠加 versionCode 偏移（arm64-v8a +2000），
          # 与 CI 生成的 versionCode 对不上；只出一个 ABI，splits 本就没有意义。
          for v in $VARIANT_LIST; do
            echo "════ 构建 $v"
            CI_VERSION_NAME="${VER}+ci-${v}.${SHORT}" \
            CI_VERSION_CODE="$CODE" \
              flutter build apk --"$v" --target-platform android-arm64
          done
          ls -la build/app/outputs/flutter-apk/ || true

      - name: Rename APK and assert naming rule
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for v in $VARIANT_LIST; do
            APKS=(build/app/outputs/flutter-apk/app-"$v".apk)
            [ "${#APKS[@]}" -eq 1 ] \
              || { echo "::error::$v 应恰好 1 个 apk，实际 ${#APKS[@]} 个（${APKS[*]:-空}）"; exit 1; }
            var="APKNAME_$(printf '%s' "$v" | tr '[:lower:]' '[:upper:]')"
            cp -- "${APKS[0]}" "dist/${!var}"
            echo "产物: dist/${!var} ← ${APKS[0]}"
          done

          RE='^[A-Za-z0-9._-]+_[0-9]{8}-[0-9]{4}_ci-[0-9]-(debug|release)_[0-9a-f]{8}\.apk$'
          apks=(dist/*.apk)
          want=$(wc -w <<< "$VARIANT_LIST")
          [ "${#apks[@]}" -eq "$want" ] || { echo "::error::应产出 $want 个包，实际 ${#apks[@]} 个"; exit 1; }
          for f in "${apks[@]}"; do
            B="$(basename "$f")"
            printf '%s' "$B" | grep -qE "$RE" \
              || { echo "::error::产物名与规则不符（或含空格/括号等 URL 不友好字符）: $B"; exit 1; }
            case "$B" in
              "${FORK_LABEL}_"*) ;;
              *) echo "::error::产物名前缀不是 ${FORK_LABEL}: $B"; exit 1 ;;
            esac
          done
          echo "✅ 命名自检通过"
          ls -la dist

      # 断言产物真的可用：包名 / 显示名 / 启动类 / 单 ABI / 变体 / 版本号 / 签名指纹。
      # 全是静默失败模式（包照样装，只是身份或签名不对），必须做成门禁。
      - name: Verify APK (package + variant + abi + signature)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(command -v apksigner || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner，无法断言签名 —— 拒绝发布"; exit 1; }
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          [ -n "$AAPT2" ] || { echo "::error::找不到 aapt2（用于读版本与 debuggable 标志）"; exit 1; }

          for APK in dist/*.apk; do
            NAME="$(basename "$APK")"
            case "$NAME" in
              *_ci-*-debug_*.apk)   VAR=debug ;;
              *_ci-*-release_*.apk) VAR=release ;;
              *) echo "::error::$NAME 无法从文件名判定变体"; exit 1 ;;
            esac
            echo "════ 校验 $NAME（$VAR）"

            BADGING="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"
            PKG_LINE="$(printf '%s' "$BADGING" | grep -m1 "^package:" || true)"
            [ -n "$PKG_LINE" ] || { echo "::error::$NAME 读不到 badging 的 package 行"; exit 1; }

            printf '%s' "$PKG_LINE" | grep -Fq "name='${EXPECT_PACKAGE}'" \
              || { echo "::error::$NAME 包名不是 ${EXPECT_PACKAGE}：$PKG_LINE"; exit 1; }
            LABEL_LINE="$(printf '%s' "$BADGING" | grep -m1 "^application-label:" || true)"
            printf '%s' "$LABEL_LINE" | grep -Fq "'${FORK_LABEL}'" \
              || { echo "::error::$NAME 显示名不是 ${FORK_LABEL}：${LABEL_LINE:-未读到}"; exit 1; }
            printf '%s' "$BADGING" | grep -Fq "launchable-activity: name='${EXPECT_ACTIVITY}'" \
              || { echo "::error::$NAME 启动类不是 ${EXPECT_ACTIVITY} —— namespace 是否被改过？"; exit 1; }
            echo "  ✅ 包名 ${EXPECT_PACKAGE} / 显示名 ${FORK_LABEL} / 启动类 ${EXPECT_ACTIVITY}"

            NC="$(printf '%s' "$BADGING" | grep -m1 "^native-code:" || true)"
            [ "$NC" = "native-code: '${EXPECT_ABI}'" ] \
              || { echo "::error::$NAME 的 native-code 不是单一 ${EXPECT_ABI}：${NC:-未读到}"; exit 1; }
            echo "  ✅ 单 ABI：${EXPECT_ABI}"

            EXPECT_VN="${VER}+ci-${VAR}.${SHORT}"
            printf '%s' "$PKG_LINE" | grep -q "versionCode='${CODE}'" \
              || { echo "::error::$NAME 的 versionCode 与 CI 生成值不符（期望 ${CODE}）：$PKG_LINE"; exit 1; }
            printf '%s' "$PKG_LINE" | grep -Fq "versionName='${EXPECT_VN}'" \
              || { echo "::error::$NAME 的 versionName 与 CI 生成值不符（期望 ${EXPECT_VN}）：$PKG_LINE"; exit 1; }
            echo "  ✅ 版本号：${EXPECT_VN}(${CODE})"

            DBG="$(printf '%s' "$BADGING" | grep -c "^application-debuggable" || true)"
            if [ "$VAR" = debug ]; then
              [ "$DBG" -ge 1 ] || { echo "::error::$NAME 名为 debug 但 badging 无 application-debuggable"; exit 1; }
              echo "  ✅ debug 变体（application-debuggable）"
            else
              [ "$DBG" -eq 0 ] || { echo "::error::$NAME 名为 release 但 badging 含 application-debuggable"; exit 1; }
              echo "  ✅ release 变体（非 debuggable）"
            fi

            OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'DOES NOT VERIFY\|Missing.*signature\|no signature'; then
              echo "::error::$NAME 未通过签名校验 —— 拒绝发布"
              printf '%s\n' "$OUT"
              exit 1
            fi
            DIGEST="$(printf '%s' "$OUT" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' | head -1)"
            [ -n "$DIGEST" ] || { echo "::error::$NAME 读不到签名证书指纹"; printf '%s\n' "$OUT"; exit 1; }
            ACTUAL="$(printf '%s' "$DIGEST" | tr -d ':' | tr 'a-f' 'A-F')"
            if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$NAME 签名指纹与固定密钥不符 —— 拒绝发布（多半是 secrets 没配好）"
              echo "  期望: $EXPECTED_CERT_SHA256"
              echo "  实际: $ACTUAL"
              exit 1
            fi
            echo "  ✅ 签名有效，指纹与固定密钥一致：$ACTUAL"

            # ⚠️ 带 --min-sdk-version 24：verify 默认按 manifest 的 minSdk 判定，minSdk ≥ 28 时
            #    apksig 视 v2 为冗余、跳过上报 ⇒ 会误报 v2: false。
            VERBOSE="$("$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" 2>&1 || true)"
            for s in v2 v3; do
              printf '%s' "$VERBOSE" | grep -qE "Verified using ${s} scheme.*: true" \
                || { echo "::error::$NAME 未启用 ${s} 签名方案 —— 拒绝发布"; printf '%s\n' "$VERBOSE"; exit 1; }
            done
            echo "  ✅ 签名方案含 v2 + v3"
          done

      # 每次构建都发一个独立 tag 的预发布页（对齐 aria2.F）：同版本重跑走 edit + clobber 覆盖。
      # ⚠️ 不要给 asset 写 label：GitHub 会用 label 顶替文件名显示。
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.info.outputs.commit }}
        run: |
          set -euo pipefail
          NOTES="$(
            echo "构建提交 [\`${SHORT}\`](https://github.com/${REPO}/commit/${COMMIT})　·　版本 ${VER}（versionCode ${CODE}）　·　变体 ${VARIANT_LIST}"
            echo
            echo "- 单 ABI \`${EXPECT_ABI}\`，包名 \`${EXPECT_PACKAGE}\` / 显示名 ${FORK_LABEL}：可与上游原版并存安装。"
            echo "- 各包共用同一把固定钥（v2 + v3 签名），debug 与 release 可互相覆盖安装。"
            echo "- debug 包调试日志最全，排障优先用它；release 包与正式版同构建类型。"
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在 —— 按重跑处理"
            gh release edit "$TAG" --notes "$NOTES" --prerelease --latest=false
          else
            jq -n --arg t "$TAG" --arg c "$COMMIT" --arg n "$NOTES" \
              '{tag_name:$t, target_commitish:$c, name:$t, body:$n, prerelease:true}' \
            | gh api -X POST "/repos/${REPO}/releases" --input -
          fi
          # 资产按上传顺序展示：release 排 debug 前面。
          APKS=()
          for v in release debug; do
            f=$(ls dist/*ci-*-${v}*.apk 2>/dev/null | head -1 || true)
            [ -n "$f" ] && APKS+=("$f")
          done
          for i in "${!APKS[@]}"; do
            [ "$i" -gt 0 ] && sleep 2
            gh release upload "$TAG" "${APKS[$i]}" --clobber
          done
          echo "已发布：https://github.com/${REPO}/releases/tag/${TAG}"

          gh api --paginate -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | select((.label // "") != "") | (.id | tostring)' \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X PATCH -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/releases/assets/${id}" -f label="" >/dev/null 2>&1 || true
            done

      # artifact 名必须带 run_number：upload-artifact 拒绝同名 artifact，
      # 「同一 commit、同一分钟内重复触发」会让 ts 与短号都相同。
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.FORK_LABEL }}-${{ steps.target.outputs.variant_tag }}-${{ steps.info.outputs.ts }}-${{ steps.info.outputs.short }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
