name: diag-token

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Show token and repo permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api /repos/${{ github.repository }} --jq '.permissions' || true
          gh api /repos/${{ github.repository }}/actions/permissions/workflow || true
          gh api /repos/${{ github.repository }}/actions/permissions || true
          echo "--- try create draft release ---"
          printf '{"tag_name":"diag-test-%s","name":"diag","draft":true}' "${{ github.run_number }}" \
            | gh api -X POST /repos/${{ github.repository }}/releases --input - || true
